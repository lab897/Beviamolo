# Pubblica il repository Flatpak su https://flatpak.beviamolo.it (GitHub Pages) a ogni release.
# Prende il tarball della release, lo aggiunge al repo già pubblicato, firma e ripubblica.
# Setup e procedura: PUBLISH_LINUX_FLATPAK.md nel monorepo.
name: Repository Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release da pubblicare (es. v1.0.40)'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Una release fa partire il workflow sul suo tag, ma un deploy di GitHub Pages fatto da un
  # tag risulta riuscito senza andare online (successo con la v1.0.41 il 2026-10-09): da
  # `main` invece funziona. Quindi alla release si rilancia lo stesso workflow su `main` col
  # tag come input, e la pubblicazione vera la fa quel giro. Il token del workflow può
  # avviare workflow_dispatch (è una delle due eccezioni al «niente workflow da GITHUB_TOKEN»).
  rimanda-a-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rilancia su main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run flatpak.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  repo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: |
          for c in ostree gpg curl; do command -v "$c" >/dev/null || NEED=1; done
          if [ -n "${NEED:-}" ]; then dnf -y install ostree gnupg2 curl; fi

      - name: Chiave di firma
        env:
          CHIAVE: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          echo "$CHIAVE" | base64 -d | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Repo con la nuova versione
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ./flatpak/pubblica-repo.sh \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/beviamolo-linux-x64.tar.gz" \
            sito

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
